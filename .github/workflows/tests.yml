name: tests

# 两件事值得分开验：
#   1. **不装 ffmpeg** 也能跑完（只拿提示词的人根本不需要 ffmpeg，这条路不能悄悄坏）
#   2. 装了 ffmpeg 的完整套件（真拼片、真烧字幕）
# 所以是两个 job，不是一个 job 里加条件。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: 离线套件 / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # 不写 cache: pip —— 这个仓库没有 requirements.txt/pyproject.toml
          # （零第三方依赖就是它的卖点），setup-python 找不到依赖文件会直接
          # 把整个 job 判失败，连测试都跑不到。

      # 刻意**不**装 ffmpeg：这条道验的就是"没有 ffmpeg 也能用"。
      # 反过来说，标了 `ffmpeg` 的用例必须真的都标了 —— 有漏标的会在这里露馅。
      - name: 装测试依赖
        run: python -m pip install --upgrade pip pytest pillow

      - name: 跑离线套件（跳过标了 ffmpeg 的用例）
        run: |
          set -o pipefail
          python -m pytest -q -m "not ffmpeg" 2>&1 | tee pytest-out.txt

      - name: 文档体检
        run: python tools/doc_audit.py

      - name: 仓库里没有真 key
        run: python -m pytest -q tests/test_no_secrets.py

      # 日志要登录才看得到，注解是公开的 —— 把失败用例名顶到注解里，
      # 从外面就能看出是哪几条挂了，不用先要一个 token。
      - name: 失败用例写进注解
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest-out.txt | head -40 | while IFS= read -r line; do
            echo "::error title=失败用例::$line"
          done
          echo "--- 末尾 40 行 ---"
          tail -40 pytest-out.txt

  with-ffmpeg:
    name: 完整套件（含出片）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 同上：没有依赖文件，就不开 pip 缓存

      - name: 装 ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: 装测试依赖
        run: python -m pip install --upgrade pip pytest pillow

      - name: 跑完整套件
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-out.txt

      - name: 失败用例写进注解
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest-out.txt | head -40 | while IFS= read -r line; do
            echo "::error title=失败用例::$line"
          done
