[pytest]
testpaths = tests
python_files = test_*.py
# 刻意不放 `-q`：`addopts` 和命令行上的 `-q` 会叠加成 `-qq`，而 `-qq` 连
# "149 passed in 42.30s" 那行汇总都不打印，只剩进度点 —— 一个刚 clone 下来
# 的人按 README 敲 `python -m pytest -q` 会看不到结果，只能靠退出码猜。
addopts = --strict-markers
markers =
    ffmpeg: 需要 ffmpeg/ffprobe 在 PATH 上（端到端出片测试）
filterwarnings =
    error::DeprecationWarning
