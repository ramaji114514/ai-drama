# 质检规则 —— 数据，不是代码。
#
# 改这个文件不需要动 Python，也不需要重新装任何东西：跑 `python run.py rules`
# 能看到骨架当前实际加载到的规则（以及它是从文件来的还是内置默认值）。
#
# 三条设计约定，改之前请先读：
#
#   1. 不认识的键会**报错**，不会静默忽略。
#      你以为参数生效了、其实没生效，是这类工具最难查的一类问题。
#   2. 没接上的检查 = 「未查成」（unchecked），不是「通过」。
#      没查成的 run 默认不会被标记为 done，除非你显式关掉严格模式。
#   3. 规则带作用域。一条给广告文案写的规则打在剧本台词上，
#      会让模型把已经写好的几十集重写一遍去满足一个不相干的约束 ——
#      所以有 applies_to / stages 两个限定字段，留空表示全部生效。
#
# 这份文件删掉也能跑（退回内置默认值），但**建议留着**：
# 能被看见的阈值才会被调。

version: "1"

# 这条规则管哪些内容形态；空 = 全部。
# 例：只给短剧用 -> applies_to: [短剧]
applies_to: []

# 这条规则在哪些阶段生效；空 = 全部。
stages: []

# ———————————————————————————————————————— 台词长度
# 中日韩字符与拉丁字符分开算。一个中文字的信息量大约是一个英文单词的
# 三分之一，用同一个数字量两种语言必然错一边。
# 阈值按"这句话能不能在一镜里说完"定，不是按字数好不好看定。
max_dialogue_cjk: 60
max_dialogue_latin: 180
# 台词过长是创作问题，报给人看就好，不该拦住整条流水线。
severity_dialogue: warn

# ———————————————————————————————————————— 单镜时长
# 这是**创作侧**约束（这场戏该给多久），不是模型能力上限。
# 模型能生成多长由 provider 的 caps 声明，超了会被自动拆成多段，
# 两件事分开管 —— 混在一个数字里，换一家模型会莫名改变你的节奏。
min_shot_seconds: 1
max_shot_seconds: 15
# 时长越界会直接毁掉音画对齐，属于必须拦。
severity_duration: block

# ———————————————————————————————————————— 画面重复
# 多个镜头的 action / 提示词是同一段文字 = 分镜没真拆开。
# 归一化空白后比对，重复长度低于 duplicate_min_chars 的不算
# （短句天然容易撞车，比如"他点头"）。
duplicate_min_chars: 12
# 重复的镜头占到多大比例才报。单个撞车不算问题。
duplicate_ratio: 0.6
severity_duplicate: warn

# ———————————————————————————————————————— 景别多样性
# 一场戏里全是中景 = 幻灯片。至少要有几种景别。
min_distinct_framings: 3
severity_framing: info

# ———————————————————————————————————————— 场尾钩子
# 短剧的平台要求：前 15 秒给一个高潮，每场结尾留一个悬念。
require_scene_hook: true
severity_hook: warn

# ———————————————————————————————————————— 听觉信息不许进画面提示词
# 这是最容易犯、后果最脏的一个错：把台词、音效、配乐、旁白写进
# 画面提示词，等于把这些信息喂给视频模型。画面是画面，声音走单独的字段。
forbidden_in_visual:
  - 旁白
  - 画外音
  - 音效
  - 配乐
  - BGM
  - 字幕
  - narration
  - voiceover
  - sound effect
  - subtitle
# 这类提示词通常是批量写坏的，不拦住会整片都脏，所以是 block。
severity_auditory: block

# ———————————————————————————————————————— 素材完整性
# 每个镜头的关键帧、片段（有台词的话还有配音）都得真的存在。
# 这一条决定了「未查成」和「通过」的区别：
# 没接素材检查器时结论是未查成，不是通过。
require_assets: true
# 素材缺失让成片根本拼不出来，必须拦。
severity_assets: block
