<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-drama</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="logo">ai-drama</span>
    <span class="tag">本机查看器 · 可改提示词</span>
  </div>
  <div class="where" id="where"></div>
  <div class="kinds" id="kinds"></div>
</header>

<div id="layout">
  <aside id="side">
    <section>
      <h2>这部剧 <span class="dim" id="projcount"></span></h2>
      <ul class="list" id="projects"></ul>
    </section>
    <section>
      <h2>历史 run <span class="dim" id="runcount"></span></h2>
      <ul class="list" id="runs"></ul>
    </section>
  </aside>

  <main id="main">
    <div class="empty" id="empty">
      <h1>左边挑一条 run</h1>
      <p class="dim">
        这里只读：它把已经写在磁盘上的东西摆出来 —— 分镜、关键帧、时间轴、字幕、
        质检结论、成本构成、资产血缘。想跑新片子还是用
        <code>python run.py run --idea "..."</code>。
      </p>
      <p class="dim" id="emptyhint"></p>
    </div>
    <div id="content" hidden></div>
  </main>
</div>

<div id="lightbox" hidden><img alt=""></div>

<script src="/app.js"></script>
</body>
</html>
